name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify engine artifact
        run: |
          set -euo pipefail
          echo "8d4920e96025ac604f0f1f791c2827c0a37972e448b3c58bb86d66495ff7d556  src/main/jniLibs/arm64-v8a/libchroot-ng.so" \
            | sha256sum -c -

      - name: Run unit tests
        run: ./gradlew :test --stacktrace --no-daemon

      - name: Build release AAR
        run: ./gradlew :assembleRelease --stacktrace --no-daemon

      - name: Verify release AAR
        run: |
          set -euo pipefail
          AAR="build/outputs/aar/chroot-engine-release.aar"
          test -f "$AAR"
          unzip -l "$AAR" > aar-contents.txt
          grep -q "jni/arm64-v8a/libchroot-ng.so" aar-contents.txt
          if grep -qE "jni/(armeabi|armeabi-v7a|x86|x86_64)/" aar-contents.txt; then
            echo "Unexpected non-arm64 native libraries in $AAR" >&2
            exit 1
          fi
          if grep -q "assets/ubuntu-base" aar-contents.txt; then
            echo "The rootfs must not be bundled in $AAR" >&2
            exit 1
          fi

          unzip -p "$AAR" classes.jar > classes.jar
          unzip -l classes.jar > classes-contents.txt
          for expected in \
            "com/vibecoderspace/chrootengine/ChrootRuntime" \
            "com/vibecoderspace/chrootengine/ChrootTerminal" \
            "com/vibecoderspace/chrootengine/RootfsProfile" \
            "com/vibecoderspace/chrootengine/DefaultProfiles" \
            "com/vibecoderspace/chrootengine/profile/UbuntuProfile" \
            "com/vibecoderspace/chrootengine/TarExtractor"; do
            grep -q "$expected" classes-contents.txt
          done

      - name: Upload release AAR
        uses: actions/upload-artifact@v7
        with:
          name: chroot-engine-release
          path: build/outputs/aar/chroot-engine-release.aar
          if-no-files-found: error
          retention-days: 14

  sample:
    name: Build sample APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify engine artifact
        run: |
          set -euo pipefail
          echo "8d4920e96025ac604f0f1f791c2827c0a37972e448b3c58bb86d66495ff7d556  src/main/jniLibs/arm64-v8a/libchroot-ng.so" \
            | sha256sum -c -

      - name: Build sample APK
        run: ./gradlew :sample:assembleDebug --stacktrace --no-daemon

      - name: Verify sample APK
        run: |
          set -euo pipefail
          APK="sample/build/outputs/apk/debug/sample-debug.apk"
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -q "lib/arm64-v8a/libchroot-ng.so" apk-contents.txt
          grep -q "lib/arm64-v8a/libtermux.so" apk-contents.txt

          unzip -p "$APK" lib/arm64-v8a/libchroot-ng.so > engine-in-apk.so
          echo "8d4920e96025ac604f0f1f791c2827c0a37972e448b3c58bb86d66495ff7d556  engine-in-apk.so" \
            | sha256sum -c -

          MANIFEST="$(find sample/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)"
          test -n "$MANIFEST"
          grep -q 'extractNativeLibs="true"' "$MANIFEST"

      - name: Upload sample APK
        uses: actions/upload-artifact@v7
        with:
          name: chroot-engine-sample-debug
          path: sample/build/outputs/apk/debug/sample-debug.apk
          if-no-files-found: error
          retention-days: 14
