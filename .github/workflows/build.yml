name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify packaged artifacts
        run: |
          set -euo pipefail
          ASSET="src/main/assets/ubuntu-base-24.04.5-base-arm64.tgz"
          test "$(stat -c%s "$ASSET")" = "29936675"
          sha256sum -c "${ASSET}.sha256"
          echo "8d4920e96025ac604f0f1f791c2827c0a37972e448b3c58bb86d66495ff7d556  src/main/jniLibs/arm64-v8a/libchroot-ng.so" \
            | sha256sum -c -

      - name: Build release AAR
        run: ./gradlew :assembleRelease --stacktrace --no-daemon

      - name: Verify release AAR
        run: |
          set -euo pipefail
          AAR="build/outputs/aar/chroot-engine-release.aar"
          test -f "$AAR"
          unzip -l "$AAR" > aar-contents.txt
          grep -q "assets/ubuntu-base-24.04.5-base-arm64.tgz" aar-contents.txt
          grep -q "jni/arm64-v8a/libchroot-ng.so" aar-contents.txt
          if grep -qE "jni/(armeabi|armeabi-v7a|x86|x86_64)/" aar-contents.txt; then
            echo "Unexpected non-arm64 native libraries in $AAR" >&2
            exit 1
          fi

      - name: Upload release AAR
        uses: actions/upload-artifact@v7
        with:
          name: chroot-engine-release
          path: build/outputs/aar/chroot-engine-release.aar
          if-no-files-found: error
          retention-days: 14
